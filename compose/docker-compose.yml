version: '3'
services:
  vpronginx:
    image: kumarltd/vpronginx:19
    ports:
      - "80:80"

  vproapp:
    image: kumarltd/vproappfix:19
    ports:
      - "8090:8080"

  vprodb:
    image: kumarltd/vprdbfix:19
    ports:
      - "3306:3306"
    volumes:
      - vprodbdata:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=vprodbpass

volumes:
  vprodbdata: {}
